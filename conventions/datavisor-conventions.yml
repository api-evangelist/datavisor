generated: '2026-08-01'
method: searched
source: DataVisor public integration guides and API references page
docs: https://www.datavisor.com/datavisor-api-guide
note: >-
  Cross-cutting request/response semantics for the DataVisor API surface, captured only
  from what DataVisor publishes anonymously. There is no public OpenAPI to derive from and
  the detailed API guide is gated, so the pagination, error-envelope, rate-limit-signalling
  and idempotency sections below are recorded as "not published" rather than guessed. No
  Idempotency pointer is emitted in apis.yml because DataVisor documents no idempotency
  contract publicly.
architecture:
  style: REST over HTTPS
  transport: HTTPS, TLS v1.2 minimum
  default_mode: real-time synchronous
  alternate_modes:
  - mode: asynchronous real-time
    mechanism: queue-based
    availability: on request, arranged through the technical account manager
  - mode: batch
    mechanism: batch integration pipe / cloud bucket push
  evidence:
    url: https://www.datavisor.com/datavisor-api-guide
    quote: >-
      "The default integration mechanism for all APIs supports real-time, synchronous
      HTTPS-based RESTful calls (secured with TLS v1.2). Please consult your technical
      account manager (TAM) for a customized integration plan if you prefer implementing
      queue-based asynchronous real-time integration."
modularity:
  note: >-
    The API set a customer calls is determined by the DataVisor solution modules they
    subscribe to, not by a single fixed catalog.
  evidence:
    url: https://www.datavisor.com/datavisor-api-guide
    quote: >-
      "For real-time integration, choose the APIs based on the specific DataVisor solution
      modules that you subscribe to. Depending on how you plan to utilize our solution, one
      or more of the APIs will be used in the integration."
result_delivery:
  channels:
  - api-response
  - cloud-bucket-push
  payload_concepts:
  - detection results
  - risk scores
  - reason codes
  - device IDs
  - risk signals
  evidence:
    url: https://www.datavisor.com/integrations/datavisor-integration-guide-for-comprehensive-fraud-solution
    quote: >-
      "DataVisor's fraud detection engine generates results via API or cloud bucket push
