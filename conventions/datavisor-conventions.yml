onboarding:
  typical_integration_time: under two weeks
  steps:
  - step: 1
    name: Integrate data
    detail: Share sample data for a quality check, then stream data to DataVisor's integration endpoint.
  - step: 2
    name: Implement detection system
    detail: Review DataVisor's detection results and reason codes and wire existing systems to parse and act on them.
  - step: 3
    name: Start using results
    detail: Define auto-action criteria from detection results and train analysts on the case management console.
