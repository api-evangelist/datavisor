apis:
- aid: datavisor:fraud-and-risk-platform
  name: DataVisor Fraud and Risk Platform API
  description: 'Real-time fraud and risk detection API surface. Customers stream user
    events and transactions to a DataVisor integration endpoint and receive detection
    results, risk scores and reason codes back. The default integration mechanism for
    all DataVisor APIs is real-time, synchronous, HTTPS-based RESTful calls secured
    with TLS v1.2; queue-based asynchronous real-time integration and batch/cloud-bucket
    push are available on request. Which APIs are used depends on the solution modules
    a customer subscribes to.'
  humanURL: https://www.datavisor.com/datavisor-api-guide
  x-base-url-note: 'No public production base URL is published. DataVisor deploys the
    detection system to dedicated per-customer cloud machines (AWS, GCP, Azure, AliCloud,
    on-premises or private cloud), so the integration endpoint is customer-specific
    and issued by the technical account manager. No baseURL is recorded here rather
    than inventing one.'
