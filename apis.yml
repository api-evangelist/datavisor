aid: datavisor
name: DataVisor
description: 'DataVisor is a Mountain View, California fraud and risk platform company
  founded in 2013 that applies unsupervised machine learning, rules, device intelligence
  and link analysis to detect fraud and financial crime in real time for banks, credit
  unions, fintechs, digital payments, life insurance and digital enterprises. The
  platform covers ACH and wire fraud, account onboarding, application fraud, account
  takeover, card fraud, check fraud, FinCrime/AML and promotion abuse, and is delivered
  as an API-integrated detection engine: customers stream events to a DataVisor integration
  endpoint over real-time synchronous HTTPS REST (TLS 1.2) or batch/cloud-bucket pipes,
  and consume detection results, scores and reason codes back through APIs or bucket
  push. Named product modules include the Fraud and Risk Platform, the dEdge device
  intelligence SDK and WebAPI, dOps fraud and risk operations, dVecto managed ML detection,
  the UML Modeling Studio and the Vera conversational AI agent. API references and
  the integration guide are published publicly, but the API guide itself, the detailed
  endpoint documentation and the admin console are gated behind customer accounts
  and technical account managers.'
