- aid: datavisor:dedge-device-intelligence
  name: DataVisor dEdge Device Intelligence WebAPI
  description: 'Device intelligence surface. The dEdge SDK is embedded in an iOS app,
    Android app or HTML5 web page, sends encrypted device data to the dEdge server,
    and receives a device token. That token is then used to query the dEdge server
    WebAPI for device-specific information such as device IDs, risk scores and other
    risk signals, which can also be fed automatically into DataVisor''s machine learning
    and rules engines.'
  humanURL: https://www.datavisor.com/integrations/datavisor-integration-guide-for-device-intelligence
  x-base-url-note: 'The dEdge server host is not published publicly; access is issued
    per customer with access keys and IP allowlisting. No baseURL is recorded rather
    than inventing one.'
