generated: '2026-08-01'
method: probed
source: live probes of DataVisor hosts
note: >-
  Probed the standard /.well-known/ discovery surface across every reachable DataVisor
  host. Nothing returned 200. www.datavisor.com is a Webflow marketing site that answers
  every /.well-known/* path with a 404 HTML body reading "Invalid .well-known request".
  admin.datavisor.com (the customer console, which docs.datavisor.com 307-redirects to)
  is behind a WAF that answers 403 to every anonymous request, including the root, so
  those 403s are a blanket denial rather than a per-path result. datavisor.zendesk.com
  (the support portal) returns 404 for every path. No WellKnown, SecurityTxt, AgentCard
  or APICatalog pointer is emitted because nothing was found.
